name: rag-knowledge-base
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  # 科学计算（conda 装更快）
  - numpy
  - pandas
  - scipy
  - scikit-learn
  # PyTorch（conda 装，cuda 依赖自动处理）
  - pytorch
  - cpuonly
  # pip 装的包
  - pip
  - pip:
    # LLM API
    - openai>=1.0.0
    # Embedding & Reranker
    - sentence-transformers>=3.0.0
    # 向量检索
    - faiss-cpu>=1.8.0
    - rank-bm25>=0.2.2
    # Web 框架
    - fastapi>=0.110.0
    - uvicorn[standard]>=0.29.0
    - pydantic>=2.0.0
    - pydantic-settings>=2.0.0
    # Demo 前端
    - gradio>=5.0.0
    # 文档解析
    - python-docx>=1.1.0
    - pymupdf>=1.23.0
    - markdown>=3.5.0
    # 工具
    - python-dotenv>=1.0.0
    - httpx>=0.27.0
    - tqdm>=4.66.0
    # 开发测试
    - pytest>=8.0.0
    - pytest-asyncio>=0.23.0
